<h2>{{ mode === 'create' ? 'Ajouter un patient' : 'Modifier un patient' }}</h2>

<form [formGroup]="patientForm" (ngSubmit)="onSubmit()">
  <label for="nom">Nom :</label>
  <input id="nom" type="text" formControlName="nom" />

  <label for="prenom">Prénom :</label>
  <input id="prenom" type="text" formControlName="prenom" />

  <label for="dateNaissance">Date de naissance :</label>
  <input id="dateNaissance" type="date" formControlName="dateNaissance" />

  <div formGroupName="genre">
    <label for="genre">Genre :</label>
    <select id="genre" formControlName="id" (change)="onGenreChange($event)">
      @for (genre of genres; track $index) {
        <option [value]="genre.id">{{ genre.libelle }}</option>
      }
    </select>  
  </div>
  
  <div formGroupName="adresse">
    <input type="hidden" formControlName="id" />
    <label for="adresse">Adresse :</label>
    <input id="adresse" type="text" formControlName="libelle" />
  </div>
  
  <div formGroupName="telephone">
    <input type="hidden" formControlName="id" />
    <label for="telephone">Téléphone :</label>
    <input id="telephone" type="text" formControlName="numero" />
  </div>

  <button type="submit">
    {{ mode === 'create' ? 'Créer' : 'Mettre à jour' }}
  </button>
</form>
