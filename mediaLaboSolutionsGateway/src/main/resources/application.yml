server:
  port: 8080

spring:
  application:
    name: mediaLaboSolutionsGateway

  cloud:
    gateway:
      routes:

        - id: patient-service
          uri: http://patient-service:8081
          predicates:
            - Path=/api/patients/**

        - id: notes-service
          uri: http://notes-service:8082
          predicates:
            - Path=/api/notes/**

        - id: risk-service
          uri: http://risk-service:8083
          predicates:
            - Path=/api/assess/**

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://192.168.1.11:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
            allowedHeaders: "*"
            allowCredentials: true

  security:
    basic:
      enabled: true
    user:
      name: admin
      password: admin123

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
